# Server-only Docker image. Local `bun dev` is unchanged — it keeps using
# `.env.local` (local Redis by default). This compose file loads `.env.docker`
# so production/containers can point at Redis Cloud + the same Atlas Mongo URI.
#
# Setup once:
#   cp .env.docker.example .env.docker
#   # paste secrets (same as .env.local) but set REDIS_URL to Redis Cloud
#   docker compose up --build   # fonts are fetched during the image build
#
# Or: bun run docker:up

services:
  video-generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: vid-template-gen-server:latest
    container_name: video-generator
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.docker
    environment:
      # Force container runtime paths (override anything in the env file)
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - STORAGE_PATH=/app/storage
      - PROCESSING_PATH=/app/storage/processing
      - GAMEPLAY_DIR=/app/storage/gameplay
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - FFPROBE_PATH=/usr/bin/ffprobe
      # Final encode passes (caption burn / mix / FX). veryfast is ~3–5× faster
      # than medium on Docker Desktop with little quality loss for Shorts.
      - FFMPEG_PRESET=${FFMPEG_PRESET:-veryfast}
      # One reel at a time — concurrent ffmpeg jobs thrash Docker Desktop CPUs.
      - QUEUE_CONCURRENCY=${QUEUE_CONCURRENCY:-1}
    volumes:
      - ./storage/templates:/app/storage/templates
      - ./storage/characters:/app/storage/characters
      - ./storage/output:/app/storage/output
      - ./storage/gameplay:/app/storage/gameplay
      # Keep ffmpeg scratch INSIDE the container (named volume). Binding
      # processing/ to the Mac/Windows host is a common cause of "ffmpeg
      # unbelievably slow" after scene clips finish.
      - processing_data:/app/storage/processing
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # No hard CPU cap — Docker Desktop already shares host cores; a 2-CPU
    # limit made full-reel re-encodes crawl. Soft memory ceiling only.
    mem_limit: 6g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  processing_data:
